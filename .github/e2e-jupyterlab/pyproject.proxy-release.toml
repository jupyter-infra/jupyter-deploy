# Template for the client-proxy release E2E gate (e2e-proxy-release.yml).
# Placeholders are replaced at build time by the Dockerfile:
#   {{PKG_VERSION}}     — client-proxy version to pin from EXTRA_INDEX_URL
#   {{EXTRA_INDEX_URL}} — index for the package under test (default: Test PyPI)
#
# Only the proxy is under test: the CLI and the jupyterlab template resolve from prod PyPI, as a
# user's install would. The proxy releases before the CLI (plugin → proxy → CLI → templates), so
# this proves the candidate works against what users already run.
[project]
name = "e2e-jupyterlab-proxy-release"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "jupyter-deploy[aws,proxy]",
    "jupyter-deploy-client-proxy=={{PKG_VERSION}}",
    "jupyter-deploy-tf-aws-ec2-jupyterlab",
    "pytest-jupyter-deploy[ui]",
    "pytest-cov",
]

[[tool.uv.index]]
name = "extra"
url = "{{EXTRA_INDEX_URL}}"
explicit = true

[tool.uv.sources]
jupyter-deploy-client-proxy = { index = "extra" }
pytest-jupyter-deploy = { path = "libs/pytest-jupyter-deploy", editable = true }
