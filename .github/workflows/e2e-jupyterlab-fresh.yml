name: E2E jupyterlab template (fresh deploy)

# Builds the E2E image, then fresh-deploys the aws-ec2-jupyterlab template, runs the
# E2E suite against it, and tears it down. Three entry points share this workflow:
# a proxy/template release gate (workflow_call, pypi install), manual dispatch, and the
# weekly canary (e2e-jupyterlab-canary.yml, which dispatches this file at the release
# tag). jupyterlab needs only AWS creds — no OAuth app / subdomain / cert quota — so it
# fresh-deploys on every run (no persistent slot).
#
# Teardown happens only when every test job passes: a FAILED run leaves the deployment up so a
# flaky test can be retried against it with "re-run failed jobs". e2e-reap-stale.yml is what
# stops that from leaking — it destroys any e2e deployment older than 12h.
on:
  workflow_call:
    inputs:
      ecr-slot:
        description: "ECR repo slot for the E2E image (7=PR/dispatch, 8=release, 9=canary)"
        required: false
        type: string
        default: "7"
      test-filter:
        description: "Pytest -k filter (empty = all tests)"
        required: false
        type: string
        default: ""
      destroy-after:
        description: "Destroy the deployment when every test job passes (a failure leaves it up for retry)"
        required: false
        type: boolean
        default: true
      install-mode:
        description: "Install mode: workspace (default) or pypi (from package index)"
        required: false
        type: string
        default: "workspace"
      install-variant:
        description: "Install variant when install-mode=pypi: release (default) or canary"
        required: false
        type: string
        default: "release"
      pkg-version:
        description: "Package version (required when install-mode=pypi, variant=release)"
        required: false
        type: string
        default: ""
      ref:
        description: "Git ref to checkout (e.g. refs/pull/185/merge for a fork PR)"
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      ecr-slot:
        description: "ECR repo slot for the E2E image (7=PR/dispatch, 8=release, 9=canary)"
        required: false
        type: choice
        options: ["7", "8", "9"]
        default: "7"
      test-filter:
        description: "Pytest -k filter (empty = all tests)"
        required: false
        type: string
        default: ""
      destroy-after:
        description: "Destroy the deployment when every test job passes (a failure leaves it up for retry)"
        required: false
        type: boolean
        default: true
      install-mode:
        description: "Install mode: workspace (default) or pypi (from package index)"
        required: false
        type: choice
        options: ["workspace", "pypi"]
        default: "workspace"
      install-variant:
        description: "Install variant when install-mode=pypi: release (default) or canary"
        required: false
        type: choice
        options: ["release", "canary"]
        default: "release"
      pkg-version:
        description: "Package version to pin (release: from the extra index; canary: from prod PyPI, empty = latest)"
        required: false
        type: string
        default: ""
      ref:
        description: "Git ref to checkout (e.g. refs/pull/185/merge for a fork PR)"
        required: false
        type: string
        default: ""

permissions:
  id-token: write
  contents: read

# Per-slot concurrency (not one shared group): each trigger owns a distinct ECR repo
# (7=PR/dispatch, 8=release, 9=canary), so release, canary, and PR/dispatch runs can
# proceed simultaneously without ever sharing an image tag. Runs within a slot serialize.
concurrency:
  group: e2e-jupyterlab-${{ inputs.ecr-slot }}
  cancel-in-progress: false

jobs:
  # --- Input gate: must precede the deploy, which replaces the slot's deployment ---

  validate:
    name: "Validate inputs"
    uses: ./.github/workflows/e2e-validate-inputs.yml
    with:
      install-mode: ${{ inputs.install-mode || 'workspace' }}
      pkg-version: ${{ inputs.pkg-version }}
      ref: ${{ inputs.ref }}

  # jupyterlab owns ECR e2e-image repos 7-9 (no OAuth app); the slot input selects one.
  build-image:
    name: "Build E2E image"
    needs: [validate]
    uses: ./.github/workflows/e2e-build-image.yml
    secrets: inherit
    with:
      oauth-app-num: ${{ inputs.ecr-slot }}
      ref: ${{ inputs.ref }}
      install-mode: ${{ inputs.install-mode || 'workspace' }}
      install-variant: ${{ inputs.install-variant || 'release' }}
      pkg-version: ${{ inputs.pkg-version }}
      template: jupyterlab

  # Job 1 — deploy fresh in-container + verify the app is immediately available.
  # `jd up` backs the project (files + tfstate) up to the S3 store; the deploy recipe
  # emits this run's deployment_id (even on a failed apply) so the test/destroy jobs can
  # scope to it — jupyterlab has no subdomain to look up the way base/eks do.
  deploy:
    name: "Deploy + verify"
    needs: [build-image]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: e2e
    permissions:
      id-token: write
      contents: read
    outputs:
      deployment-id: ${{ steps.deploy.outputs.deployment_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install UV and Python
        uses: ./.github/actions/install-uv
        with:
          python-version: "3.13"

      - name: Install just
        uses: ./.github/actions/install-just

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::997498698382:role/jupyter-infra-ci-e2e-6a3e2625
          aws-region: us-west-2
          role-duration-seconds: 7200

      - name: Restore CI project
        run: just ci-restore sandbox-ci

      - name: Pull pre-built E2E image
        run: just ci-e2e-base-pull ${{ inputs.ecr-slot }} ${{ needs.build-image.outputs.ecr-tag }}

      - name: Seed .env
        run: just env-setup-jupyterlab

      # Deploys THROUGH pytest in fresh-deploy mode, so `jd up` and the
      # test_immediately_available_after_deployment assertion happen in the SAME pytest
      # session — seconds apart, with no intervening `jd config` or container restart. That
      # is the point of folding the old separate "Verify deployment" step into the deploy: a
      # second step ran against a now-existing project, which re-ran a full terraform plan and
      # restarted the container first, inserting minutes of slack that masked exactly the
      # propagation delay a user would feel. (It also needed --with-full-deployment forced on,
      # which was the smell.)
      #
      # The recipe emits `deployment_id` to $GITHUB_OUTPUT even when the deploy fails, then
      # re-raises the failure, so the destroy job can always scope its teardown.
      - name: Deploy + verify (jd init / config / up, in-session)
        id: deploy
        run: just ci-e2e-jupyterlab-deploy sandbox-e2e

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-jupyterlab-deploy
          path: test-results/
          if-no-files-found: ignore

      - name: Upload test results to S3
        if: failure()
        continue-on-error: true
        run: just ci-upload-test-results ${{ inputs.ecr-slot }}

  # Job 2 — restore the deployment from the store and run the non-mutating tests. These assume
  # the as-deployed defaults (t3.medium + uv, no external volumes), which is why they run before
  # the mutating pass and not after.
  test:
    name: "Non-mutating tests"
    needs: [build-image, deploy]
    if: needs.deploy.result == 'success'
    uses: ./.github/workflows/e2e-jupyterlab-job.yml
    secrets: inherit
    with:
      ecr-tag: ${{ needs.build-image.outputs.ecr-tag }}
      ecr-slot: ${{ inputs.ecr-slot }}
      deployment-id: ${{ needs.deploy.outputs.deployment-id }}
      test-filter: ${{ inputs.test-filter }}
      job-name: "Non-mutating tests"
      ref: ${{ inputs.ref }}
      timeout-minutes: 120

  # Job 3 — apply #1, ISOLATED because it is the one that fails for reasons that are not ours.
  # A GPU instance type is refused for lack of capacity (`InsufficientInstanceCapacity`) often
  # enough that it dominates this workflow's flake rate, and no AWS API reports capacity ahead of
  # time — see the g5-vs-g6 evidence in tests/e2e/configurations/env.example and #374.
  #
  # Its own job so that "re-run failed jobs" retries ONLY this, instead of redoing the
  # non-mutating pass that already passed. Deliberately still BLOCKING (no continue-on-error): a
  # real GPU regression must red the run, and the retry path is what makes the flake affordable.
  #
  # Ordered first among the mutating jobs and cannot be reordered: apply #2 transitions
  # pixi -> uv, which is only meaningful after apply #1 put the deployment on pixi. So an ICE here
  # still blocks the job below — the split buys retry granularity, not independence.
  test-gpu:
    name: "Mutating tests (GPU swap)"
    needs: [build-image, deploy, test]
    if: needs.test.result == 'success'
    uses: ./.github/workflows/e2e-jupyterlab-job.yml
    secrets: inherit
    with:
      ecr-tag: ${{ needs.build-image.outputs.ecr-tag }}
      ecr-slot: ${{ inputs.ecr-slot }}
      deployment-id: ${{ needs.deploy.outputs.deployment-id }}
      marker: "gpu"
      mutate: true
      job-name: "Mutating tests (GPU swap)"
      ref: ${{ inputs.ref }}
      timeout-minutes: 120

  # Job 4 — every other mutating test, on the SAME deployment: apply #2 (GPU/pixi -> CPU/uv) and
  # apply #3 (the availability-zone swap that preserves volume data).
  #
  # Selected by marker rather than by file, so `mutating and not gpu` picks up any mutating test
  # added later without touching this workflow. Split from the GPU job only so a GPU capacity flake
  # does not discard them. test_volume_swaps is the one file here that IS a valid
  # standalone entry point (its volumes_provisioned fixture provisions what it needs), so it can be
  # promoted to its own job later without touching the tests.
  test-mutating:
    name: "Mutating tests (CPU swap + volumes)"
    needs: [build-image, deploy, test, test-gpu]
    if: needs.test-gpu.result == 'success'
    uses: ./.github/workflows/e2e-jupyterlab-job.yml
    secrets: inherit
    with:
      ecr-tag: ${{ needs.build-image.outputs.ecr-tag }}
      ecr-slot: ${{ inputs.ecr-slot }}
      deployment-id: ${{ needs.deploy.outputs.deployment-id }}
      marker: "mutating and not gpu"
      mutate: true
      job-name: "Mutating tests (CPU swap + volumes)"
      ref: ${{ inputs.ref }}
      timeout-minutes: 120

  # Job 5 — teardown, ONLY when everything passed.
  #
  # A failed run deliberately LEAVES the deployment up, so a flaky test can be retried with
  # "re-run failed jobs" against the same infrastructure instead of paying a fresh deploy, and so
  # the failure can be inspected live. That is a change from tearing down unconditionally.
  #
  # The cost of that choice is a deployment nobody is watching — a GPU instance mid-flake bills
  # until it is reaped — so it is only safe BECAUSE of e2e-reap-stale.yml, which destroys any
  # e2e deployment older than 12h. Do not tighten this condition without checking the reaper still
  # runs, and do not loosen the reaper without reverting this.
  destroy:
    name: "Teardown deployment"
    needs: [build-image, deploy, test, test-gpu, test-mutating]
    if: >-
      always() && inputs.destroy-after
      && needs.deploy.outputs.deployment-id != ''
      && needs.deploy.result == 'success'
      && needs.test.result == 'success'
      && needs.test-gpu.result == 'success'
      && needs.test-mutating.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: e2e
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install UV and Python
        uses: ./.github/actions/install-uv
        with:
          python-version: "3.13"

      - name: Install just
        uses: ./.github/actions/install-just

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::997498698382:role/jupyter-infra-ci-e2e-6a3e2625
          aws-region: us-west-2
          role-duration-seconds: 7200

      - name: Restore CI project
        run: just ci-restore sandbox-ci

      # Restore this run's project by deployment id, jd down, and delete the store entry.
      - name: Teardown deployment
        run: just find-takedown-jupyterlab sandbox-e2e ${{ needs.deploy.outputs.deployment-id }}
