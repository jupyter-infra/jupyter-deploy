name: Validate E2E dispatch inputs

# Guards the dispatch inputs whose combinations are silently discarded rather than rejected, so a
# form typo becomes a teardown plus a failed build instead of an annotation. Two shapes matter:
#
#   - the `pkg-version` / `ref` swap: the fields are adjacent in the form, and `pkg-version` is read
#     only when install-mode=pypi, so a ref typed there used to be dropped and the run tested the
#     dropdown branch
#   - the `install-mode` / `install-variant` / `pkg-version` triangle: `INSTALL_VARIANT` reaches the
#     Dockerfile only in pypi mode, and the release pyproject pins `<package>=={{PKG_VERSION}}`, so
#     pypi+release with an empty version renders a bare `==` and the build fails on an unparseable
#     requirement
#
# Runs as a gate job ahead of the teardown and build jobs -- they start in parallel, so a check
# inside the build alone cannot stop the teardown, and a misfire otherwise costs a full suite plus,
# for base, a Let's Encrypt cert.

on:
  workflow_call:
    inputs:
      install-mode:
        description: "Install mode the caller resolved: workspace or pypi"
        required: false
        type: string
        default: "workspace"
      install-variant:
        description: "Install variant the caller resolved, only read when install-mode=pypi: release or canary"
        required: false
        type: string
        default: "release"
      pkg-version:
        description: "Package version to pin (only read when install-mode=pypi)"
        required: false
        type: string
        default: ""
      ref:
        description: "Git ref to checkout (empty = the triggering ref)"
        required: false
        type: string
        default: ""

jobs:
  validate:
    name: "Validate inputs"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check install mode, variant, version and ref
        env:
          INSTALL_MODE: ${{ inputs.install-mode }}
          INSTALL_VARIANT: ${{ inputs.install-variant }}
          PKG_VERSION: ${{ inputs.pkg-version }}
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail

          fail() {
            echo "::error title=Bad dispatch input::$1"
            exit 1
          }

          # Versions this repo publishes: 0.7.0, 0.1.0rc2, 1.0. Never contains a slash, so this
          # also rejects refs/pull/N/merge, branch names and 'heads/...' landing in pkg-version.
          version_re='^[0-9]+(\.[0-9]+)+[0-9a-z.]*$'

          case "$INSTALL_MODE" in
            workspace | pypi) ;;
            *) fail "install-mode='$INSTALL_MODE' is not 'workspace' or 'pypi'." ;;
          esac

          # A variant with no pyproject.<variant>.toml fails the build after the teardown has run.
          case "$INSTALL_VARIANT" in
            release | canary) ;;
            *) fail "install-variant='$INSTALL_VARIANT' is not 'release' or 'canary'." ;;
          esac

          if [ -n "$PKG_VERSION" ]; then
            case "$PKG_VERSION" in
              */*)
                fail "pkg-version='$PKG_VERSION' looks like a git ref (it has a '/'). Did you mean the 'ref' input?"
                ;;
            esac

            if ! printf '%s' "$PKG_VERSION" | grep -qE "$version_re"; then
              fail "pkg-version='$PKG_VERSION' is not a version like 0.7.0 or 0.1.0rc2."
            fi

            # Fail loudly where the old behaviour silently discarded the value. Keep the message on
            # one line: a newline inside a ::error:: annotation needs %0A escaping to survive.
            if [ "$INSTALL_MODE" != "pypi" ]; then
              fail "pkg-version='$PKG_VERSION' set with install-mode='$INSTALL_MODE'; only read when pypi."
            fi
          elif [ "$INSTALL_MODE" = "pypi" ] && [ "$INSTALL_VARIANT" = "release" ]; then
            # The release pyproject pins '<package>=={{PKG_VERSION}}': an empty version renders a
            # bare '==' and the build dies on an unparseable requirement, after cleanup-existing has
            # already destroyed the deployment. Canary is exempt -- there an empty version means
            # 'latest from prod PyPI', which is what the canary-from-main fallback dispatches.
            fail "install-mode=pypi with install-variant=release needs a pkg-version; only canary may leave it empty."
          fi

          # INSTALL_VARIANT reaches the Dockerfile only in pypi mode, so a canary selected alongside
          # workspace mode used to run the workspace suite under a canary label.
          if [ "$INSTALL_VARIANT" = "canary" ] && [ "$INSTALL_MODE" != "pypi" ]; then
            fail "install-variant=canary set with install-mode='$INSTALL_MODE'; only read when pypi."
          fi

          # The inverse swap. Release tags are '<package>==<version>', so they do not match.
          if [ -n "$REF" ] && printf '%s' "$REF" | grep -qE "$version_re"; then
            fail "ref='$REF' looks like a package version. Did you mean the 'pkg-version' input?"
          fi

          variant_note=""
          [ "$INSTALL_MODE" = "pypi" ] || variant_note=" (unused: not pypi)"

          {
            echo "### E2E inputs validated"
            echo ""
            echo "| input | value |"
            echo "| --- | --- |"
            echo "| install-mode | \`$INSTALL_MODE\` |"
            echo "| install-variant | \`$INSTALL_VARIANT\`$variant_note |"
            echo "| pkg-version | \`${PKG_VERSION:-(empty)}\` |"
            echo "| ref | \`${REF:-(empty, uses the triggering ref)}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
