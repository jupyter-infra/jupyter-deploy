[project]
name = "jupyter-deploy-monorepo"
version = "0.6.8"
description = "Monorepo for Jupyter deploy packages"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jupyter-deploy[aws,k8s]",
]

[tool.uv.sources]
jupyter-deploy = { workspace = true }
pytest-jupyter-deploy = { workspace = true }
jupyter-deploy-client-proxy = { workspace = true }
# Template packages: dev-only, so a fresh `uv sync` registers their
# `jupyter_deploy.terraform_templates` entry points and `jd init` finds them. They are
# NOT core deps of the CLI (which stays template-agnostic) — only of this dev monorepo.
jupyter-deploy-tf-aws-ec2-base = { workspace = true }
jupyter-deploy-tf-aws-ec2-jupyterlab = { workspace = true }
jupyter-deploy-tf-aws-eks-oidc = { workspace = true }
jupyter-infra-tf-aws-iam-ci = { workspace = true }

[tool.uv.workspace]
members = [
    "libs/jupyter-deploy",
    "libs/jupyter-deploy-client-proxy",
    "libs/jupyter-deploy-tf-aws-ec2-base",
    "libs/jupyter-deploy-tf-aws-ec2-jupyterlab",
    "libs/jupyter-deploy-tf-aws-eks-oidc",
    "libs/jupyter-infra-tf-aws-iam-ci",
    "libs/pytest-jupyter-deploy",
    "images/uvbase"
]

[tool.ruff]
line-length = 120

[tool.uv]
dev-dependencies = [
    "jupyter_core>=5.0.0",
    "mypy>=1.15.0",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "pytest-jupyter-deploy",
    "jupyter-deploy-client-proxy",
    "jupyter-deploy-tf-aws-ec2-base",
    "jupyter-deploy-tf-aws-ec2-jupyterlab",
    "jupyter-deploy-tf-aws-eks-oidc",
    "jupyter-infra-tf-aws-iam-ci",
    "pytest-playwright>=0.6.2",
    "ruff>=0.11.8",
    "typer>=0.15.4",
    "rich>=10.11.0",
    "parameterized>=0.9.0",
    "tomli-w>=1.2.0",
    "yamllint>=1.35.0",
    "trustme>=1.1.0",
    "types-aiofiles>=24.1.0",
    "types-pexpect>=4.9.0",
    "types-requests>=2.32.0",
    "myst-parser>=4.0.0",
    "shibuya>=2025.1.1",
    "sphinx-copybutton>=0.5.0",
    "sphinx-design>=0.6.0",
    "sphinx-tabs>=3.4.0",
    "sphinx-click>=6.0.0",
]

[tool.ruff.lint]
preview = true
select = [
    "E",  # pycodestyle
    "F",  # pyflakes
    "UP",  # pyupgrade
    "B",  # flake8-bugbear
    "SIM",  # flake8-simplify
    "I",  # isort
    "PLC0415",  # import-outside-toplevel - disallow lazy imports
]
ignore = [
    # Ignore other preview rules we're not ready for yet
    "UP042",  # Replace str/Enum with StrEnum (Python 3.11+)
    "UP046",  # Use PEP 695 type parameters (Python 3.12+)
    "UP047",  # Use PEP 695 type parameters for functions (Python 3.12+)
]

[tool.ruff.lint.per-file-ignores]
# Allow lazy imports in provider factory (handles optional dependencies)
"**/provider/instruction_runner_factory.py" = ["PLC0415"]
# GitHub utility scripts - allow simpler code patterns
".github/**/*.py" = ["SIM108"]

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
explicit_package_bases = true
mypy_path = [
    "libs/jupyter-deploy",
    "libs/jupyter-deploy-client-proxy",
    "libs/jupyter-deploy-client-proxy/tests/functional",
    "libs/jupyter-deploy-tf-aws-ec2-base",
    "libs/jupyter-deploy-tf-aws-ec2-jupyterlab",
    "libs/jupyter-deploy-tf-aws-eks-oidc",
    "libs/jupyter-infra-tf-aws-iam-ci",
    "libs/pytest-jupyter-deploy",
    "scripts",
]
plugins = ["pydantic.mypy"]
files = [
    "libs/jupyter-deploy",
    "libs/jupyter-deploy-client-proxy",
    "libs/jupyter-deploy-tf-aws-ec2-base",
    "libs/jupyter-deploy-tf-aws-ec2-jupyterlab",
    "libs/jupyter-deploy-tf-aws-eks-oidc",
    "libs/jupyter-infra-tf-aws-iam-ci",
    "libs/pytest-jupyter-deploy",
    "scripts",
]
# Template test directories excluded: identical module paths (tests/unit/, tests/e2e/)
# across template packages cause "Duplicate module" errors. Each template package
# runs its own mypy via [tool.mypy] in its pyproject.toml.
exclude = [
    "libs/jupyter-deploy-tf-aws-ec2-base/tests/",
    "libs/jupyter-deploy-tf-aws-ec2-jupyterlab/tests/",
    "libs/jupyter-deploy-tf-aws-eks-oidc/tests/",
    "libs/jupyter-infra-tf-aws-iam-ci/tests/",
    # The jupyterlab template ships runtime service config files (jupyter_server_config*.py)
    # with the SAME module names as the base template — checking both trips mypy's
    # "Duplicate module" error. These are on-instance runtime scripts, not importable CLI
    # code; the base template's copies remain type-checked.
    "libs/jupyter-deploy-tf-aws-ec2-jupyterlab/jupyter_deploy_tf_aws_ec2_jupyterlab/template/",
    "tests/e2e/",
]

# kubernetes package ships without py.typed and no maintained stubs exist (kubernetes-stubs stuck at v22)
[[tool.mypy.overrides]]
module = "kubernetes.*"
ignore_missing_imports = true
follow_untyped_imports = true

# aiologger (client-proxy dep) has no py.typed / stubs. (aiofiles is imported directly by the
# client proxy and typed via the types-aiofiles dev stub, so it needs no override here.)
[[tool.mypy.overrides]]
module = ["aiologger.*"]
ignore_missing_imports = true

# psutil ships without py.typed; the client proxy records its own process creation time with it.
[[tool.mypy.overrides]]
module = ["psutil", "psutil.*"]
ignore_missing_imports = true
follow_untyped_imports = true

[tool.pytest.ini_options]
pythonpath = [
  "libs/jupyter-deploy",
  "libs/jupyter-deploy-client-proxy",
  "libs/jupyter-deploy-tf-aws-ec2-base",
  "libs/jupyter-deploy-tf-aws-ec2-jupyterlab",
  "libs/jupyter-deploy-tf-aws-eks-oidc",
  "libs/jupyter-infra-tf-aws-iam-ci",
  "libs/pytest-jupyter-deploy"
]
markers = [
  "e2e: marks tests as end-to-end tests (deselect with '-m \"not e2e\"')",
  "cli: Non-mutating CLI tests for release validation (select with '-m cli')",
  "bare: Tests requiring the bare install track with no AWS deps (select with '-m bare')",
]
addopts = "-m 'not e2e' --import-mode=importlib"
# tests/functional run via `just functional-test` (prepend import-mode, per-package rootdir) — not here.
norecursedirs = ["**/tests/e2e", "**/tests/functional"]
filterwarnings = [
    # aiologger's internal JSON formatter uses the deprecated datetime.utcnow() — third-party, not ours.
    "ignore:datetime.datetime.utcnow:DeprecationWarning",
]
