[project]
name = "jupyter-deploy-client-proxy"
version = "0.1.0"
description = "Local client that routes an app from localhost to a jupyter-deploy-managed remote host."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Jonathan Guinegagne", email = "jggg@amazon.com" },
    { name = "Michael Chin", email = "chnmch@amazon.com" },
    { name = "Brian Granger", email = "brgrange@amazon.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.10.0",
    "aiologger>=0.7.0",
    "psutil>=5.9.0",
    "pydantic>=2.11.5",
    "typer>=0.15.4",
]

[project.scripts]
jupyter-deploy-client-proxy = "jupyter_deploy_client_proxy.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jupyter_deploy_client_proxy"]

[project.urls]
Homepage = "https://github.com/jupyter-infra/jupyter-deploy"
Repository = "https://github.com/jupyter-infra/jupyter-deploy/tree/main/libs/jupyter-deploy-client-proxy"
Issues = "https://github.com/jupyter-infra/jupyter-deploy/issues"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
preview = true
select = [
    "E",  # pydocstyle
    "F",  # pyflakes
    "UP",  # pyupgrade
    "B",  # flake8-bugbear
    "SIM",  # flake8-simplify
    "I",  # isort
    "PLC0415",  # import-outside-toplevel - disallow lazy imports
]
ignore = [
    "UP042",  # Replace str/Enum with StrEnum (Python 3.11+)
    "UP046",  # Use PEP 695 type parameters (Python 3.12+)
    "UP047",  # Use PEP 695 type parameters for functions (Python 3.12+)
]

[tool.ruff.lint.per-file-ignores]
# Allow lazy imports in tests (common pattern for imports after mocks)
"tests/**/*.py" = ["PLC0415"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
mypy_path = ["."]
packages = ["jupyter_deploy_client_proxy"]
plugins = ["pydantic.mypy"]

# aiologger has no py.typed and no stub package. (aiofiles is untyped too, but its
# `types-aiofiles` dev stub covers our imports — see dependency-groups.dev.)
[[tool.mypy.overrides]]
module = ["aiologger.*"]
ignore_missing_imports = true

# psutil ships without py.typed; used to record the proxy's own process creation time.
[[tool.mypy.overrides]]
module = ["psutil", "psutil.*"]
ignore_missing_imports = true
follow_untyped_imports = true

[tool.pytest.ini_options]
addopts = "--cov=jupyter_deploy_client_proxy --cov-report=term-missing --cov-report=xml --cov-report=html"
testpaths = ["tests/unit", "tests/functional"]
markers = [
    "functional: Loopback functional tests exercising the real proxy against a self-signed origin.",
]
filterwarnings = [
    # aiologger's internal JSON formatter uses the deprecated datetime.utcnow() — third-party, not ours.
    "ignore:datetime.datetime.utcnow:DeprecationWarning",
]

[tool.coverage.run]
source = ["jupyter_deploy_client_proxy"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]
fail_under = 80
show_missing = true

[tool.uv.sources.jupyter-deploy-client-proxy]
workspace = true

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "ruff>=0.11.8",
    "trustme>=1.1.0",
    "types-aiofiles>=24.1.0",
]
