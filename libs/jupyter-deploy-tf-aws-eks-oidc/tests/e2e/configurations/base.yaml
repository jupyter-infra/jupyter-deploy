schema_version: 2
required:
  domain: "${JD_E2E_VAR_DOMAIN}"
  subdomain: "${JD_E2E_VAR_SUBDOMAIN}"
  letsencrypt_email: "${JD_E2E_VAR_EMAIL}"
  oauth_app_client_id: "${JD_E2E_VAR_OAUTH_APP_CLIENT_ID}"
  oauth_allowed_teams: ${JD_E2E_VAR_OAUTH_ALLOWED_TEAMS}
required_sensitive:
  oauth_app_client_secret: "${JD_E2E_VAR_OAUTH_APP_CLIENT_SECRET}"
overrides:
  admin_role_names: ${JD_E2E_VAR_ADMIN_ROLE_NAMES}
  enable_default_gpu_pool: ${JD_E2E_VAR_ENABLE_DEFAULT_GPU_POOL}
  # NOTE: the idle-timeout floor is intentionally left at its production default
  # (15). test_workspace_idleshutdown needs a 1-minute timeout, but it lowers the
  # floor at runtime via the relaxed_idle_floor fixture (which reverts on teardown)
  # rather than baking a low floor into the deployment. This keeps the E2E sandbox
  # faithful to a real deployment and lets the test run against any existing project.
