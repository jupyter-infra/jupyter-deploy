apiVersion: workspace.jupyter.org/v1alpha1
kind: Workspace
metadata:
  name: e2e-gpu-workspace
  namespace: default
spec:
  displayName: "E2E GPU Workspace"
  desiredStatus: Running
  ownershipType: Public
