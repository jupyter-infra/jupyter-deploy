# -- Namespace where the WorkspaceTemplate are created.
sharedNamespace: jupyter-k8s-shared

# -- Name of the WorkspaceAccessStrategy to reference in the WorkspaceTemplate.
# Must match the strategy created by the aws-oidc chart (accessStrategy.createOAuth).
accessStrategy:
  name: oauth-access-strategy

# -- WorkspaceTemplate definitions, one card in the workspace UI per entry.
# A values-file list replaces this default wholesale (helm list semantics), so
# terraform always injects the full list; the entry here serves standalone
# renders and unit tests. Per-entry fields:
#   name/isDefault/displayName/description/imageUri/appType - identity + card copy
#   accessType/ownershipType/storageClassName               - workspace defaults
#   defaultResources/resourceBounds                          - per-resource-key
#     requests/limits and min/max (extended keys like nvidia.com/gpu included)
#   nodeSelector/tolerations                                 - placement; must match
#     the role of the Karpenter pool the template targets
#   readinessProbe/idleShutdown                              - probe + idle policy
workspaceTemplates:
  - name: jupyterlab
    isDefault: "true"
    displayName: JupyterLab
    description: "JupyterLab workspace with persistent EBS storage"
    imageUri: ""
    appType: jupyterlab
    accessType: OwnerOnly
    ownershipType: OwnerOnly
    storageClassName: ebs-sc
    defaultResources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "2"
        memory: "4Gi"
    resourceBounds:
      cpu:
        min: "100m"
        max: "8"
      memory:
        min: "256Mi"
        max: "32Gi"
    nodeSelector:
      jupyter-deploy/role: workspaces
    tolerations:
      - key: jupyter-deploy/role
        operator: Equal
        value: workspaces
        effect: NoSchedule
    readinessProbe:
      port: 8888
      initialDelaySeconds: 2
      periodSeconds: 3
      failureThreshold: 30
    idleShutdown:
      enabled: true
      timeoutMinutes: 60
      minTimeoutMinutes: 15
      maxTimeoutMinutes: 480

# -- Namespace-scoped NetworkPolicy governing ingress to workspace pods. One
# policy is created per workspace namespace, replacing the per-workspace policy
# the aws-oidc router chart used to create (accessStrategy.createNetworkPolicy).
networkPolicy:
  # -- Whether to create the workspace ingress NetworkPolicy.
  create: true
  # -- Namespaces where workspaces run; one NetworkPolicy is created in each.
  workspaceNamespaces:
    - default
  # -- Namespace of the Traefik router that proxies workspace traffic.
  routerNamespace: jupyter-k8s-router
  # -- Namespace of the operator that probes workspaces for idle detection.
  operatorNamespace: jupyter-k8s-system
  # -- Workspace application port allowed for ingress.
  port: 8888
