{{- range .Values.workspaceTemplates }}
---
apiVersion: workspace.jupyter.org/v1alpha1
kind: WorkspaceTemplate
metadata:
  name: {{ .name | quote }}
  namespace: {{ required "workspaceTemplates[].namespace is required" .namespace }}
  labels:
    workspace.jupyter.org/default-template: {{ .isDefault | quote }}
spec:
  displayName: {{ .displayName | quote }}
  description: {{ .description | quote }}
  defaultImage: {{ .imageUri }}
  appType: {{ .appType }}
  defaultAccessType: {{ .accessType }}
  defaultOwnershipType: {{ .ownershipType }}
  defaultAccessStrategy:
    name: {{ .accessStrategy | default $.Values.accessStrategy.name }}
    namespace: {{ $.Values.sharedNamespace }}
  defaultResources:
    {{- .defaultResources | toYaml | nindent 4 }}
  resourceBounds:
    resources:
      {{- .resourceBounds | toYaml | nindent 6 }}
  primaryStorage:
    defaultSize: "10Gi"
    minSize: "1Gi"
    maxSize: "100Gi"
    defaultStorageClassName: {{ .storageClassName }}
    defaultMountPath: "/home/jovyan"
  # Gate workspace readiness on the app actually accepting connections, so the
  # operator does not flip status.condition[Available]=True before the server is
  # up. Complements the access-strategy startupProbe.
  defaultReadinessProbe:
    {{- if .readinessProbe.path }}
    httpGet:
      path: {{ .readinessProbe.path }}
      port: {{ .readinessProbe.port }}
    {{- else }}
    tcpSocket:
      port: {{ .readinessProbe.port }}
    {{- end }}
    initialDelaySeconds: {{ .readinessProbe.initialDelaySeconds }}
    periodSeconds: {{ .readinessProbe.periodSeconds }}
    failureThreshold: {{ .readinessProbe.failureThreshold }}
  defaultPodSecurityContext:
    fsGroup: 1000
  {{- with .baseEnv }}
  baseEnv:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  defaultNodeSelector:
    {{- .nodeSelector | toYaml | nindent 4 }}
  defaultTolerations:
    {{- .tolerations | toYaml | nindent 4 }}
  {{- with .idleShutdown }}
  defaultIdleShutdown:
    enabled: {{ .enabled }}
    idleTimeoutInMinutes: {{ .timeoutMinutes }}
    detection:
      httpGet:
        path: {{ .detection.path }}
        port: {{ .detection.port }}
        transport: network
        lastActivityTimestamp:
          responseBodyPath: {{ .detection.responseBodyPath }}
          format: {{ .detection.format }}
  idleShutdownOverrides:
    allow: true
    minIdleTimeoutInMinutes: {{ .minTimeoutMinutes }}
    maxIdleTimeoutInMinutes: {{ .maxTimeoutMinutes }}
  {{- end }}
{{- end }}
