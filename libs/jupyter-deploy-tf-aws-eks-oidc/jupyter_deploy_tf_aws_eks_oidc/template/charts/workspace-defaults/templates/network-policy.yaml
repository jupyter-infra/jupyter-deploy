{{- if .Values.networkPolicy.create }}
{{- /* A rule without ports admits every port, so an empty list or the old single-port key is refused. */}}
{{- if hasKey .Values.networkPolicy "port" }}
{{- fail "networkPolicy.port was replaced by networkPolicy.routerPorts and networkPolicy.operatorPorts" }}
{{- end }}
{{- if not .Values.networkPolicy.routerPorts }}
{{- fail "networkPolicy.routerPorts must list at least one port" }}
{{- end }}
{{- if not .Values.networkPolicy.operatorPorts }}
{{- fail "networkPolicy.operatorPorts must list at least one port" }}
{{- end }}
{{- range $ns := .Values.networkPolicy.workspaceNamespaces }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workspace-ingress
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/managed-by: jupyter-deploy
spec:
  # Selects every workspace pod in the namespace (label set by the operator).
  podSelector:
    matchLabels:
      workspace.jupyter.org/component: workspace
  policyTypes:
    - Ingress
  ingress:
    # Traefik router proxying authenticated workspace traffic.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Values.networkPolicy.routerNamespace }}
      ports:
        {{- range $.Values.networkPolicy.routerPorts }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
    # Operator idle-detection probes (transport: network).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Values.networkPolicy.operatorNamespace }}
      ports:
        {{- range $.Values.networkPolicy.operatorPorts }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
{{- end }}
{{- end }}
