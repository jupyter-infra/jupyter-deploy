# -- Prefix Dex adds to OIDC group claims. Subjects in Role/ClusterRoleBindings
# are matched as "<prefix><org>:<team>".
oidcGroupPrefix: "github:"

# -- Every "org:team" allowed to log in (oauth_allowed_teams). Members receive
# a ClusterRole (self-subject access reviews for kubelogin) and read-only
# discovery of the access strategies in the shared namespace.
allowedGroups: []
  # - my-org:team-a

# -- Workspace namespaces and the "org:team" groups granted workspace CRUD in
# each. Each namespace gets a Role and a RoleBinding to its groups only, so a
# team holds no permission in a namespace that does not list it.
namespaceGrants: []
  # - name: team-ml
  #   groups:
  #     - my-org:ml
