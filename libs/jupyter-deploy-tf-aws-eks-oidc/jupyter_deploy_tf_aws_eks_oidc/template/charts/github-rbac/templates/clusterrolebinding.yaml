apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: github-auth-whoami
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: github-auth-whoami
subjects:
{{- range $group := .Values.allowedGroups }}
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: {{ $.Values.oidcGroupPrefix }}{{ $group }}
{{- end }}
