{{- range $grant := .Values.namespaceGrants }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-workspace-binding
  namespace: {{ $grant.name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: github-workspace-role
subjects:
{{- range $group := $grant.groups }}
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: {{ $.Values.oidcGroupPrefix }}{{ $group }}
{{- end }}
{{- end }}
