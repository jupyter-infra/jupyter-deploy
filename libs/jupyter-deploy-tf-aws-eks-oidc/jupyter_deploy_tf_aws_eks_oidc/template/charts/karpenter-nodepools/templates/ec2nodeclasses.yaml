# EC2NodeClasses define the AWS-level node configuration for Karpenter.
# One class per pool (routing + workspaces) — they differ only in root disk size.
# IMDSv2 hop limit MUST be 2: containers are one network hop beyond the host,
# so the default limit of 1 breaks pod IAM credential retrieval.
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: routing
spec:
  amiSelectorTerms:
    - alias: al2023@latest
  instanceProfile: {{ .Values.nodeInstanceProfile | quote }}
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.clusterName | quote }}
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.clusterName | quote }}
  tags:
    karpenter.sh/cluster-name: {{ .Values.clusterName | quote }}
  metadataOptions:
    httpPutResponseHopLimit: 2
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 50Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: workspaces
spec:
  amiSelectorTerms:
    - alias: al2023@latest
  instanceProfile: {{ .Values.nodeInstanceProfile | quote }}
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.clusterName | quote }}
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.clusterName | quote }}
  tags:
    karpenter.sh/cluster-name: {{ .Values.clusterName | quote }}
  metadataOptions:
    httpPutResponseHopLimit: 2
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 100Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
