; Supervisor runs as PID 1 so JupyterLab and the remote access server restart
; independently: a crash in one must not take the workspace down with it.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; startretries is set explicitly on every program: the default of 3 leaves a
; program FATAL for the life of the container while the pod still reports Ready,
; so a transient failure at boot would silently cost the workspace a service.
[program:jupyter]
command=/usr/local/bin/jupyter-start.sh
autostart=true
autorestart=true
startretries=1000
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; Off unless the access strategy sets REMOTE_ACCESS_AUTOSTART, so an image built
; before remote access is enabled does not run an SSH server nothing can reach.
[program:remote-access]
command=/usr/local/bin/remote-access-server
autostart=%(ENV_REMOTE_ACCESS_AUTOSTART)s
autorestart=true
startretries=1000
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
