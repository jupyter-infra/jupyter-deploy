services:
  e2e:
    build:
      context: .
      dockerfile: ${E2E_DOCKERFILE:-Dockerfile}
      args:
        USER_UID: ${HOST_UID:-1000}
        USER_GID: ${HOST_GID:-1000}
    image: ${E2E_IMAGE:-jupyter-deploy-e2e:latest}
    container_name: jupyter-deploy-e2e
    hostname: ${HOSTNAME:-localhost}
    working_dir: /workspace
    # User is set in Dockerfile based on build args
    volumes:
      # Mount .auth directory to persist authentication state (cookie cache reused across runs)
      - ./.auth:/workspace/.auth
      # Mount AWS credentials (read-only) - accessible by testuser
      - ~/.aws:/home/testuser/.aws:ro
      # Mount kube config - needed for kubectl commands and jd cluster login
      - ~/.kube:/home/testuser/.kube
      # Terraform provider plugin cache (see TF_PLUGIN_CACHE_DIR below), bind-mounted at the
      # SAME absolute path inside and outside the container. That symmetry is the point, not the
      # sharing: `terraform init` records provider locations in <project>/.terraform/providers as
      # ABSOLUTE symlinks into this cache, and a project dir is visible from both worlds. With a
      # container-only path those symlinks dangle on the host, and every `jd` command that reads
      # terraform output then fails with "Required plugins are not installed" — or worse, a
      # `jd down` that destroys nothing while exiting non-zero. It also survives `down -v`, and
      # the host's own `terraform init` populates the very same cache.
      - ${HOME}/.terraform.d/plugin-cache:${HOME}/.terraform.d/plugin-cache
      # Project directory will be mounted dynamically via override file in justfile
    env_file:
      - ./.env
    environment:
      # AWS credential passthrough for CI (OIDC session credentials)
      # Empty defaults are safe: the SDK ignores them and falls back to ~/.aws/config
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      # AWS_REGION must be set to a real value — the SDK treats "" as a valid but
      # broken region instead of falling back to ~/.aws/config. The justfile resolves
      # this from `aws configure get region` and writes it to .env.
      - AWS_REGION=${AWS_REGION}
      # Bare passthrough: set in container only if defined on host. Do NOT default
      # to "default" — boto3 raises ProfileNotFound when AWS_PROFILE is explicitly
      # set but ~/.aws/config doesn't exist (e.g. CI runners). When unset, boto3
      # falls back to the default profile gracefully or uses env var credentials.
      - AWS_PROFILE
      - AWS_CONFIG_FILE=/home/testuser/.aws/config
      - AWS_SHARED_CREDENTIALS_FILE=/home/testuser/.aws/credentials
      # Share one provider download across every `terraform init` in the session instead of
      # re-fetching the AWS provider per project. The dominant cost of the config-test class,
      # which runs `jd init` + `jd config` in a throwaway project per test.
      - TF_PLUGIN_CACHE_DIR=${HOME}/.terraform.d/plugin-cache
    network_mode: host
    # Keep container running in background
    command: sleep infinity
