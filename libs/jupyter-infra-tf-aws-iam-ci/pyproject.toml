[project]
name = "jupyter-infra-tf-aws-iam-ci"
version = "0.2.0"
description = "CI infrastructure template for jupyter-deploy — manages IAM OIDC, CI role, and Secrets Manager secrets."
readme = "README.md"
authors = [
    { name = "Jonathan Guinegagne", email = "jggg@amazon.com" },
    { name = "Michael Chin", email = "chnmch@amazon.com" },
    { name = "Brian Granger", email = "ellisonbg@gmail.com" },
    { name = "Andrii Ieroshenko", email = "aieroshe@amazon.com" },
]
requires-python = ">=3.12"
dependencies = []

[project.license]
file = "LICENSE"

[project.entry-points."jupyter_deploy.terraform_templates"]
aws_iam_ci = "jupyter_infra_tf_aws_iam_ci.template:TEMPLATE_PATH"

[project.urls]
Homepage = "https://github.com/jupyter-infra/jupyter-deploy"

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "jupyter_infra_tf_aws_iam_ci",
]

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
mypy_path = [
    ".",
]
packages = [
    "jupyter_infra_tf_aws_iam_ci",
]

[tool.ruff]
extend-exclude = [
    ".conda/",
]
line-length = 120

[tool.ruff.lint]
preview = true
select = [
    "E",
    "F",
    "UP",
    "B",
    "SIM",
    "I",
    "PLC0415",
]
ignore = [
    "UP042",
    "UP046",
    "UP047",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = 40

# The tooling the [tool.mypy] and [tool.ruff] configs above are useless without: syncing this
# package on its own has to produce an environment that can run its own lint and test steps.
[dependency-groups]
dev = [
    "jupyter-deploy",
    "pytest-jupyter-deploy[ui]",
    "mypy>=1.15.0",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "python-hcl2>=7.2.1",
    "pyyaml>=6.0.2",
    "ruff>=0.11.8",
    "types-pyyaml>=6.0.12.20250516",
    "yamllint>=1.35.0",
]
