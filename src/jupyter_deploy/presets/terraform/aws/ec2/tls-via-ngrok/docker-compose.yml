services:
  jupyter:
    user: "${SERVICE_UID}:${SERVICE_GID}"
    image: quay.io/jupyter/base-notebook:latest
    ports:
      - "8888:8888"
    restart: unless-stopped
    networks:
      - web
    environment:
      - JUPYTER_TOKEN=ABC
    volumes:
      - /mnt/jupyter-data:/home/jovyan
  ngrok:
    user: "${SERVICE_UID}:${SERVICE_GID}"
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command:
      - "start"
      - "--all"
      - "--config"
      - "/etc/ngrok/ngrok.yml"
    volumes:
      - ./ngrok.yml:/etc/ngrok/ngrok.yml:ro
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    networks:
      - web
    depends_on:
      - jupyter  # Ensure jupyter starts before ngrok
networks:
  web:
    driver: bridge